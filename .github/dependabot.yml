version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      maven:
        patterns: ["*"]
    ignore:
      # Quarkus 4 waits for its first LTS (ADR 0018)
      - dependency-name: "io.quarkus:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

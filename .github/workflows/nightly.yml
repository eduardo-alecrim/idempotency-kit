name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-tck:
    name: store TCK (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, mysql, mariadb, oracle, sqlserver]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Install the modules the store depends on
        run: ./mvnw -B -ntp install -DskipTests -pl idempotency-store-jdbc -am
      # NFR-04: 10 000 rounds of the concurrency test
      - name: Store TCK
        run: >-
          ./mvnw -B -ntp verify -pl idempotency-store-jdbc -Djacoco.skip=true
          -Didempotency.tck.databases=${{ matrix.database }}
          -Didempotency.tck.race.iterations=10000
      - name: Store TCK summary
        if: always()
        run: python3 -I .github/scripts/tck-summary.py idempotency-store-jdbc/target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

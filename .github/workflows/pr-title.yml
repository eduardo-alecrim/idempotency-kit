name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      # Squash merges use the PR title as the commit message, so it must follow Conventional Commits.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            revert
          scopes: |
            core
            store-jdbc
            store-redis
            spring
            quarkus
            client
            tck
            docs
            build
          requireScope: false
